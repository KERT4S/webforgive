<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgive Me?</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #fff0f5;
      margin: 0;
      overflow: hidden; /* Prevents scrollbars when button moves to edges */
    }
    h1 {
      color: #d147a3;
      margin-bottom: 30px;
    }
    /* This wrapper acts as the screen boundary for the moving button */
    .game-area {
      position: relative;
      width: 100vw;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* This container holds them side-by-side initially */
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: fit-content;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #yesBtn {
      background-color: #4caf50;
      color: white;
    }
    #noBtn {
      background-color: #f44336;
      color: white;
      /* Starts normally side-by-side, shifts to absolute on first hover/tap */
      position: relative; 
      transition: left 0.1s ease, top 0.1s ease;
    }
  </style>
</head>
<body>

  <h1>Do you forgive me? 🥺</h1>

  <div class="game-area">
    <div class="btn-container">
      <button id="yesBtn" onclick="alert('Yay! Thank you! ❤️')">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    function moveButton() {
      // Switch to absolute positioning so it can teleport anywhere on screen
      if (noBtn.style.position !== 'absolute') {
        noBtn.style.position = 'absolute';
      }

      // Calculate safe boundaries based on the window size
      const padding = 50; 
      const maxX = window.innerWidth - noBtn.clientWidth - padding;
      const maxY = window.innerHeight - noBtn.clientHeight - padding;

      // Generate random coordinates anywhere on the user's screen
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      // Apply the new position
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // Triggers when mouse hovers over it (Desktop)
    noBtn.addEventListener('mouseenter', moveButton);

    // Triggers when tapped (Mobile/Tablets)
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // Prevents accidental click triggering before moving
      moveButton();
    });
    noBtn.addEventListener('click', moveButton);
  </script>

</body>
</html>
